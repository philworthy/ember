<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember — ready to cook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0D0E}
a{color:#F3F1ED}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0D0E; color: #F3F1ED; font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 18px; font-weight: 600; letter-spacing: -0.02em">Ember</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #A3A09A; padding: 5px 10px; border: 1px solid #26292C; border-radius: 999px"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{dot}}"></span>{{status}}</span>
</div>
<div style="display: flex; align-items: center">
<a href="History.dc.html" aria-label="History" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #A3A09A">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v3.5h3.5M12 8v4l3 2"></path></svg>
</a>
<button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #A3A09A; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.75; stroke-linecap: round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
</button>
</div>
</header>

<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; gap: 12px; align-items: flex-start; background: #2A1A14; border-radius: 16px; padding: 14px 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: none; margin-top: 1px; stroke: #FF9A6B; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M3 3l18 18"></path></svg>
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1">
<span style="font-size: 15px; font-weight: 500">Can't reach the grill</span>
<span style="font-size: 13px; color: #D6C3BA; line-height: 1.4">Check the iKamand has power and is on Wi-Fi. Last seen 2 min ago.</span>
</div>
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #5A3A2C; background: transparent; color: #F3F1ED; font-size: 13px; cursor: pointer">Retry</button>
</div>
</sc-if>

<section style="background: #16181A; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 6px; opacity: {{dim}}">
<div style="font-size: 13px; color: #A3A09A; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FF7A3D"></span>Pit</div>
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 72px; font-weight: 300; letter-spacing: -0.05em; line-height: 1">68<span style="font-size: 36px; color: #A3A09A; vertical-align: top">°</span></span>
<span style="font-size: 14px; color: #A3A09A">Not lit</span>
</div>
</section>

<section style="background: #16181A; border-radius: 22px; padding: 6px 16px; display: flex; flex-direction: column; opacity: {{dim}}">
<sc-for list="{{probes}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: space-between; height: 52px; border-bottom: {{p.rule}}">
<span style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: {{p.fg}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{p.color}}"></span>{{p.label}}</span>
<span style="font-size: 15px; color: {{p.fg}}">{{p.reading}}</span>
</div>
</sc-for>
</section>

<div style="flex: 1"></div>

<section style="display: flex; flex-direction: column; gap: 10px">
<a href="SetTarget.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 16px; border-radius: 16px; background: #16181A; text-decoration: none">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A3A09A">Pit target</span><span style="font-size: 17px; font-weight: 500">250° · Smoke</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: #A3A09A; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<a href="SetTarget.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 16px; border-radius: 16px; background: #16181A; text-decoration: none">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A3A09A">Probe targets</span><span style="font-size: 17px; font-weight: 500">P1 203° · P2 203°</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: #A3A09A; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px">
<a href="FireUp.dc.html" style="height: 56px; border-radius: 16px; border: 1px solid #2E3134; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: #FF7A3D; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.8 2.2-5 .2 1.6 1 2.6 2 3 0-3 .3-5.5.8-8z"></path></svg>Fire it up</a>
<a href="Main.dc.html" style="height: 56px; border-radius: 16px; background: #FF7A3D; color: #0C0D0E; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Start cook</a>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"connection":{"editor":"enum","options":["Ready","Offline"],"default":"Ready"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const offline = (this.props.connection ?? 'Ready') === 'Offline';
    const probes = [
      { n: 1, color: '#F4CF63', reading: '66°' },
      { n: 2, color: '#5AA9F8', reading: '67°' },
      { n: 3, color: '#3A3D40', reading: 'Not plugged in', muted: true }
    ].map((p, i) => Object.assign(p, {
      label: 'Probe ' + p.n,
      fg: p.muted ? '#7D7A75' : '#F3F1ED',
      rule: i < 2 ? '1px solid #1F2225' : '0'
    }));
    return {
      offline, probes,
      status: offline ? 'Offline' : 'Ready',
      dot: offline ? '#FF7A3D' : '#5FD08A',
      dim: offline ? '0.45' : '1'
    };
  }
}
</script>
</body>
</html>
