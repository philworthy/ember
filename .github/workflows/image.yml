# Checks the code, then builds the Docker image, smoke-tests it on the simulator, and publishes it
# to ghcr.io/philworthy/ember for Intel and ARM. The NAS pulls :latest (docs/deploy.md).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ember:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the image exactly as the NAS does, but on the simulator: it must start, answer
      # /healthz, and serve the PWA.
      - name: Smoke test
        run: |
          docker run -d --name ember -p 8080:8080 \
            -e USE_SIMULATOR=true -e SIM_SCENARIO=brisket ember:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://127.0.0.1:8080/manifest.webmanifest
          docker inspect --format '{{.State.Health.Status}}' ember || true
      - name: Container logs
        if: always()
        run: docker logs ember || true

      # The NAS may be ARM: check the native SQLite module and tsx load there too (under QEMU).
      - name: Build for the ARM check
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ember:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: ARM check
        run: |
          docker run --rm --platform linux/arm64 ember:arm64 node --import tsx -e "
            const Database = (await import('better-sqlite3')).default;
            const db = new Database(':memory:');
            console.log('sqlite', db.prepare('select sqlite_version() v').get().v, process.arch);
          "

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Publish (Intel and ARM)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
